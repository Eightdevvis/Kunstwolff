name: Sync content folders

on:
  push:
    branches:
      - main
    paths:
      - public/landings/landings.md
      - public/skills/skills.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate missing landing/skill folders
        run: npm run sync:content

      - name: Commit generated folders
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/img/slides public/reviews public/img/UnsereFähigkeitenBilder public/img/Titelbild public/img/why public/why public/faq
            git commit -m "chore: sync content folders"
            git push
          else
            echo "No folder changes to commit"
          fi
